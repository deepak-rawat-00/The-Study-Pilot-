    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Logo Icon Container -->
  <rect x="100" y="100" width="80" height="80" rx="20" fill="#4338CA"/>
  <circle cx="140" cy="140" r="30" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 6" stroke-opacity="0.45" />
  <path d="M140 110V116" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 116L156 146L140 138L124 146L140 116Z" fill="#FFFFFF"/>
  <circle cx="140" cy="138" r="4.4" fill="#10B981" />

  <!-- Brand Name -->
  <text x="200" y="152" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">The Study Pilot</text>
  <text x="200" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Navigation for your study goals</text>

  <!-- Main Headline -->
  <text x="100" y="270" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Free Study Planners,</text>
  <text x="100" y="335" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Consistency Tools &amp; Guides</text>

  <!-- Subtitle -->
  <text x="100" y="405" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Plan study sessions • Measure net focus hours • Build unbroken daily streaks</text>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">8 Interactive Tools</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="350" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">11 Strategy Guides</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="230" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="595" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">10 Free Printables</text>
